<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a Formularios</title>
    <!-- Librería de íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #ffffff; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
            line-height: 1.6;
        }
        h1 { 
            color: #1a73e8; 
            margin-top: 0; 
            text-align: center; 
            font-size: 2rem;
            border-bottom: 2px solid #e8f0fe;
            padding-bottom: 10px;
        }
        p { 
            color: #444; 
            font-size: 15px; 
            margin-bottom: 15px; 
            text-align: justify;
        }
        .highlight {
            background-color: #e8f0fe;
            padding: 12px;
            border-left: 4px solid #1a73e8;
            border-radius: 4px;
            font-size: 14px;
            color: #1967d2;
        }
    </style>
</head>

<div class="card">
    <h1>Formularios</h1>
    
    <p>Un formulario permite al visitante cargar datos y que sean enviados al servidor.</p>
    
    <div class="highlight">
        El HTML no tiene la responsabilidad de registrar los datos en el servidor, esta actividad se delega a través de un lenguaje que se ejecute en el servidor (PHP, ASP, ASP.NET, Node, etc.).
    </div>
</div>
