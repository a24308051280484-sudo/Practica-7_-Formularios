<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Archivos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1a73e8; margin-top: 0; text-align: center; }
        label { font-weight: 600; color: #444; display: block; margin-top: 10px; margin-bottom: 5px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; background: #fafafa; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; font-size: 14px; }
        button[type="submit"] { background-color: #1a73e8; }
        button[type="submit"]:hover { background-color: #1557b0; }
        button[type="reset"] { background-color: #ea4335; }
        button[type="reset"]:hover { background-color: #c5221f; }
    </style>
</head>
<body>

<!--
    Nombre: Ismael Arellano Delgado
    Grado: 5I
    Número de control: 24308051280484
-->

<div class="card">
    <h2>Formulario con archivos</h2>
    <form action="" method="post" enctype="multipart/form-data">
        <label>Ingresa tu nombre:</label>
        <input type="text" name="nombre">
        
        <label>Selecciona un archivo:</label>
        <input type="file" name="archivo">
        
        <div class="btn-group">
            <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
            <button type="reset">Borrar <i class="fa fa-trash"></i></button>
        </div>
    </form>
</div>

</body>
</html>
