<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Limitaciones</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1a73e8; margin-top: 0; text-align: center; }
        label { font-weight: 600; color: #444; display: block; margin-top: 12px; margin-bottom: 5px; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        input[disabled] { background-color: #e9ecef; cursor: not-allowed; color: #6c757d; }
        textarea[readonly] { background-color: #f8f9fa; color: #495057; resize: none; }
        .hint { font-size: 11px; color: #ea4335; margin-top: 2px; }
    </style>
</head>
<body>

<!--
    Nombre: Ismael Arellano Delgado
    Grado: 5I
    Número de control: 24308051280484
-->

<div class="card">
    <h2>Formulario con limitaciones</h2>
    <form action="" method="post">
        <label>Ingresa tu nombre (Deshabilitado):</label>
        <input type="text" name="nombre" disabled value="Campo no editable">
        
        <label>Contraseña (Máx. 5 caracteres):</label>
        <input type="password" name="pass" maxlength="5">
        <span class="hint">* Límite máximo de 5 caracteres</span>
        
        <label>Comentarios (Solo lectura):</label>
        <textarea name="comentarios" rows="3" readonly>Este es mi comentario y no se puede borrar</textarea>
    </form>
</div>

</body>
</html>
