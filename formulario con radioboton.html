<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Radiobotón</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #1a73e8; margin-top: 0; text-align: center; }
        label { font-weight: 600; color: #444; display: block; margin-top: 10px; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .radio-group { margin-top: 10px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .radio-item { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-weight: 500; color: #333; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        input[type="submit"], input[type="reset"] { flex: 1; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        input[type="submit"] { background-color: #1a73e8; color: white; }
        input[type="submit"]:hover { background-color: #1557b0; }
        input[type="reset"] { background-color: #ea4335; color: white; }
        input[type="reset"]:hover { background-color: #c5221f; }
    </style>
</head>
<body>

<!--
    Nombre: Ismael Arellano Delgado
    Grado: 5I
    Número de control: 24308051280484
-->

<div class="card">
    <h2>Formularios con Radioboton</h2>
    <form action="" method="post">
        <label>Ingresa tu nombre:</label>
        <input type="text" name="nombre">
        
        <label>Selecciona el máximo de estudios que tienes:</label>
        <div class="radio-group">
            <div class="radio-item"><input type="radio" name="estudios" value="1"> Sin estudios</div>
            <div class="radio-item"><input type="radio" name="estudios" value="2"> Primaria</div>
            <div class="radio-item"><input type="radio" name="estudios" value="3"> Secundaria</div>
            <div class="radio-item"><input type="radio" name="estudios" value="4"> Preparatoria</div>
        </div>
        
        <div class="btn-group">
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">
        </div>
    </form>
</div>

</body>
</html>
